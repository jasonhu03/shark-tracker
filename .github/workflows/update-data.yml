name: Update Shark Data

on:
  workflow_dispatch:  # lets you trigger it manually from GitHub's UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Workflow is running"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        working-directory: shark-tracker-data