name: Update Shark Data

on: 
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
        working-directory: shark-tracker-data
      - name: Run ingestion
        run: node ingest.js
        working-directory: shark-tracker-data
      - name: Run export
        run: node export.js
        working-directory: shark-tracker-data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shark-tracker-data/sharks.db shark-tracker-data/output
          git diff --staged --quiet || git commit -m "Automated data update"
          git push